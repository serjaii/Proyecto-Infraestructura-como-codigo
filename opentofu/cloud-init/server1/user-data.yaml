#cloud-config
hostname: apache2
users:
  - name: debian
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    ssh-authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHiYl8Co8WopWUl0IpwkIaGSJvJ5E18jojHVrxQQrGK/ sjnezsrez@gmail.com
chpasswd:
  expire: False
  users:
    - name: debian
      password: asdasd
      type: text

# Habilitar IP forwarding y configurar NAT
bootcmd:
  - echo 1 > /proc/sys/net/ipv4/ip_forward

runcmd:
  # Hacer permanente el IP forwarding
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
  - sysctl -p
  # Instalar iptables-persistent para guardar las reglas
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent
  # Configurar NAT (masquerade) para las redes internas
  - iptables -t nat -A POSTROUTING -s 192.168.201.0/24 -o ens3 -j MASQUERADE
  - iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -o ens3 -j MASQUERADE
  # Guardar las reglas de iptables
  - netfilter-persistent save
