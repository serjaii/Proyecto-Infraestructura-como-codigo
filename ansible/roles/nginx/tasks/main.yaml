- name: Instalar paquetes necesarios para LEMP (Nginx, PHP)
  apt:
    name:
      - nginx
      - php-fpm
      - php-mysql
      - php-mbstring
      - php-xml
      - php-json
      - php-curl
      - php-zip
      - php-gd
      - git
      - acl
      - unzip
    state: present
    update_cache: yes

- name: Configuración de server block (virtualhost)
  template:
    src: etc/nginx/server_block.j2
    dest: /etc/nginx/sites-available/{{item["name"]}}.conf
    owner: root
    group: root
  with_items:
    - "{{virtualhosts}}"

- name: Crear DocumentRoot si no existe
  ansible.builtin.file:
    path: /{{item["datos"]["documentroot"]}}
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  with_items:
    - "{{virtualhosts}}"

- name: Activación de los server blocks
  file:
    src: /etc/nginx/sites-available/{{item["name"]}}.conf
    dest: /etc/nginx/sites-enabled/{{item["name"]}}.conf
    state: link
  with_items:
    - "{{virtualhosts}}"
  notify: restart nginx

- name: Mark git safe directory for the application
  command: git config --global --add safe.directory "{{ base_web_path }}"
  become: yes
  become_user: root

- name: Clonar repositorio de la aplicación Guestbook como root
  git:
    repo: "{{ guestbook_repo_url }}"
    dest: "/{{ base_web_path }}"
    version: main
    force: yes
  become: yes
  become_user: root

- name: Ajustar permisos del directorio de la aplicación
  file:
    path: "/{{ base_web_path }}"
    owner: www-data
    group: www-data
    recurse: yes
  become: yes
  become_user: root

- name: Crear fichero de configuración config.php dentro de la aplicación
  ansible.builtin.template:
    src: config.php.j2
    dest: "/{{ base_web_path }}/config.php"
    owner: www-data
    group: www-data

- name: Descargar phpMyAdmin
  get_url:
    url: https://files.phpmyadmin.net/phpMyAdmin/5.2.1/phpMyAdmin-5.2.1-all-languages.tar.gz
    dest: /tmp/phpmyadmin.tar.gz

- name: Crear directorio para phpMyAdmin
  file:
    path: /var/www/phpmyadmin
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Extraer phpMyAdmin
  unarchive:
    src: /tmp/phpmyadmin.tar.gz
    dest: /var/www/phpmyadmin
    remote_src: yes
    extra_opts: [--strip-components=1]
    owner: www-data
    group: www-data

- name: Configurar phpMyAdmin config.inc.php
  template:
    src: phpmyadmin_config.inc.php.j2
    dest: /var/www/phpmyadmin/config.inc.php
    owner: www-data
    group: www-data

